# Rift: web app + dedicated FFmpeg worker. Uses the prebuilt image from GitHub Container Registry (SQLite).
#   docker compose up -d                  # pulls ghcr.io/nopethedev/rift:latest, no local build
#   docker compose pull && docker compose up -d   # update (also happens on every `up`, see pull_policy)
# Build from source instead (own changes, PostgreSQL/MySQL):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.build.yml --profile postgres up -d --build
# Pin a version with RIFT_IMAGE=ghcr.io/nopethedev/rift:sha-<commit> in .env.
x-image: &image ${RIFT_IMAGE:-ghcr.io/nopethedev/rift:latest}

services:
  web:
    image: *image
    pull_policy: always
    restart: unless-stopped
    ports: ["${RIFT_PORT:-3000}:3000"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/rift.db}
      WORKER_URL: http://worker:4100
      WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN in .env}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - rift-data:/app/data
      - ${MEDIA_PATH:-./media}:/media
    depends_on: [worker]

  worker:
    image: *image
    pull_policy: always
    restart: unless-stopped
    command: ["npm", "run", "start:worker"]
    environment:
      WORKER_PORT: 4100
      WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN in .env}
      MAX_SESSIONS: ${MAX_SESSIONS:-2}
      TRANSCODE_DIR: /transcode
    volumes:
      # Media must be mounted at the same path as in the web container.
      - ${MEDIA_PATH:-./media}:/media:ro
      - transcode:/transcode
    # Hardware acceleration (uncomment what applies):
    # devices: ["/dev/dri:/dev/dri"]          # VAAPI / Intel QSV
    # deploy: { resources: { reservations: { devices: [{ capabilities: [gpu] }] } } }   # NVIDIA NVENC

  postgres:
    profiles: [postgres]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rift
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rift}
      POSTGRES_DB: rift
    volumes: [pg-data:/var/lib/postgresql/data]

volumes:
  rift-data:
  transcode:
  pg-data:
