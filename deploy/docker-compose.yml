# Rift on a VPS: pulls the prebuilt image (nothing is built on the server).
#   docker compose up -d                          # Rift on :3000
#   docker compose --profile https up -d          # + automatic HTTPS via Caddy (set RIFT_DOMAIN in .env)
#   docker compose --profile auto-update up -d    # + pull new versions automatically
# Update manually any time:  docker compose pull && docker compose up -d
name: rift

x-image: &image ${RIFT_IMAGE:-ghcr.io/nopethedev/rift:latest}

services:
  web:
    image: *image
    pull_policy: always   # `docker compose up -d` always fetches the newest image for the tag
    restart: unless-stopped
    # With the https profile, put RIFT_BIND=127.0.0.1 in .env so only Caddy is exposed.
    ports: ["${RIFT_BIND:-0.0.0.0}:${RIFT_PORT:-3000}:3000"]
    environment:
      DATABASE_URL: file:/app/data/rift.db
      WORKER_URL: http://worker:4100
      WORKER_TOKEN: ${WORKER_TOKEN:?run install.sh or set WORKER_TOKEN in .env}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      OPENSUBTITLES_API_KEY: ${OPENSUBTITLES_API_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Rift Music: with `--profile lavalink` put LAVALINK_URL=http://lavalink:2333 (and LAVALINK_PASSWORD) in .env
      LAVALINK_URL: ${LAVALINK_URL:-}
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      LAVALINK_CONFIG_DIR: /lavalink-config
    volumes:
      - rift-data:/app/data
      - lavalink-config:/lavalink-config
      - ${MEDIA_PATH:-./media}:/media
    depends_on: [worker]
    labels: ["com.centurylinklabs.watchtower.enable=true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  worker:
    image: *image
    pull_policy: always   # `docker compose up -d` always fetches the newest image for the tag
    restart: unless-stopped
    command: ["npm", "run", "start:worker"]
    environment:
      WORKER_PORT: 4100
      WORKER_TOKEN: ${WORKER_TOKEN:?run install.sh or set WORKER_TOKEN in .env}
      MAX_SESSIONS: ${MAX_SESSIONS:-2}
      TRANSCODE_DIR: /transcode
      # Rift Music: on-demand cache + the Lavalink audio bridge (the bridge needs a name Lavalink can reach: the service name)
      MUSIC_CACHE_DIR: /music-cache
      SINK_PUBLIC_HOST: ${SINK_PUBLIC_HOST:-worker}
      SINK_PUBLIC_IP: ${SINK_PUBLIC_IP:-}
      SINK_TLS_DIR: /sink
    volumes:
      # Media must be mounted at the same path as in the web container.
      - ${MEDIA_PATH:-./media}:/media:ro
      - transcode:/transcode
      - music-cache:/music-cache
      - sink-tls:/sink
    labels: ["com.centurylinklabs.watchtower.enable=true"]
    # Hardware acceleration (uncomment what applies):
    # devices: ["/dev/dri:/dev/dri"]          # VAAPI / Intel QSV
    # deploy: { resources: { reservations: { devices: [{ capabilities: [gpu] }] } } }   # NVIDIA NVENC

  # Automatic HTTPS (Let's Encrypt). Needs a domain pointing at this server and ports 80/443 open.
  caddy:
    profiles: [https]
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      RIFT_DOMAIN: ${RIFT_DOMAIN:-localhost}   # set in .env when using the https profile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [web]

  # Checks every 5 minutes for a newer image and restarts only the containers labelled above.
  updater:
    profiles: [auto-update]
    image: ghcr.io/nicholas-fedor/watchtower:latest
    restart: unless-stopped
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"

  # ---- Rift Music: optional bundled Lavalink (docker compose --profile lavalink up -d) ----------------------------
  # Lavalink only outputs audio to Discord-style voice connections, so the Rift worker runs an "audio bridge" that
  # Lavalink connects to as a voice server. This one-shot job makes Lavalink's JVM trust the bridge's certificate.
  lavalink-trust:
    profiles: [lavalink]
    image: ghcr.io/lavalink-devs/lavalink:4
    user: root
    restart: "no"
    entrypoint: ["/bin/sh", "/lavalink-trust.sh"]
    volumes:
      - ./lavalink-trust.sh:/lavalink-trust.sh:ro
      - sink-tls:/sink:ro
      - lavalink-trust:/trust
    depends_on: [worker]

  lavalink:
    profiles: [lavalink]
    image: ghcr.io/lavalink-devs/lavalink:4
    restart: unless-stopped
    environment:
      SERVER_PORT: 2333
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      # Plugins and the password are written by Admin → Music → Settings → "Save & write Lavalink config".
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/config/
      JAVA_TOOL_OPTIONS: -Xmx${LAVALINK_HEAP:-1g} -Djavax.net.ssl.trustStore=/trust/trust.jks -Djavax.net.ssl.trustStorePassword=changeit
    volumes:
      - lavalink-config:/config:ro
      - lavalink-trust:/trust:ro
      - lavalink-plugins:/opt/Lavalink/plugins
    depends_on:
      lavalink-trust: { condition: service_completed_successfully }

volumes:
  rift-data:
  transcode:
  caddy-data:
  music-cache:
  sink-tls:
  lavalink-config:
  lavalink-trust:
  lavalink-plugins:
